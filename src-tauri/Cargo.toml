[package]
name = "mdcoder"
version = "0.1.0"
description = "MDCoder — local-first markdown editor"
authors = ["MDCoder Authors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "inkstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
dirs = "5"
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "macros"] }
log = "0.4"
env_logger = "0.11"
notify = "6"
walkdir = "2"
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
